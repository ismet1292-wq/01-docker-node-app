name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: docker build -t devops-node-app:ci .

      - name: Start application
        run: |
          docker run -d -p 3000:3000 --name app devops-node-app:ci
          sleep 5

      - name: Health check
        run: curl http://localhost:3000