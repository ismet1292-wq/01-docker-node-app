name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test HTTP behavior
        run: npm test

      - name: Build Docker image
        run: docker build -t devops-node-app:ci .

      - name: Verify actual container and clean it up
        run: python3 scripts/verify-container.py
